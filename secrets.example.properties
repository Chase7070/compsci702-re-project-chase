API_BASE_URL=replace_me
API_TEST_KEY=replace_me
# Local bootstrap value (never commit real values).
# Debug: Gradle writes this to app/src/debug/assets/auth_bootstrap.txt (gitignored).
# Release: Gradle encrypts this into build-generated AES-GCM credential fragments at compile time.
AUTH_HEADER_VALUE=replace_me
# Optional: comma-separated extra hostnames (no https://) allowed for image GETs if not under API_BASE_URL host.
# ALLOWED_NETWORK_HOSTS=cdn.example.com,images.example.com
#
# Required for release builds. Debug may leave empty to simplify local proxy/debug work.
# Comma-separated OkHttp certificate pins.
# - `sha256/...` applies to the host of API_BASE_URL
# - `cdn.example.com=sha256/...` applies to an extra allowed host
# Release must provide pins for every allowed host.
# When the server rotates certs, update both pins.
# Example captured for ai.elliottwen.info (verify before production):
# CERT_PINS=sha256/Y+qVcAbTbJUkv0N0yR2D7+qaY+yBS8BGRAG0U5ukZec=,sha256/kIdp6NNEd8wsugYyyIYFsi1ylMCED3hZbSR8ZFsa/A4=
#
# Release signing cert SHA-256 (lowercase hex, no colons).
# Required for release credential decryption when not using the default debug keystore.
# If empty, the build uses ~/.android/debug.keystore (typical for emulator release APKs).
# RELEASE_SIGNING_SHA256=
